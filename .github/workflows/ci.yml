name: CI
# Automatic CI is intentionally paused during active development.
# Run this workflow manually only when explicitly requested.
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
          cache: false
      - run: pnpm setup:install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=test-results/unit.xml
      - run: pnpm cores:download
        env:
          GH_TOKEN: ${{ github.token }}
          WITH_CADDY: "1"
      - name: Go race tests and six real sing-box protocols
        working-directory: fq
        env:
          SING_BOX_BINARY: ${{ github.workspace }}/resources/bin/sing-box-linux-amd64
        run: go test -race -v ./... | tee ../test-results/go.txt
      - name: Real sing-box detour chain and failure localization
        run: pnpm test:integration | tee test-results/chain.txt
      - run: pnpm fq:build
      - name: Real systemd deployment, Caddy and rollback
        run: node tests/systemd-integration.mjs
      - run: pnpm build
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
          cache: false
      - run: pnpm setup:install
      - run: pnpm fq:build
      - run: pnpm cores:download
        env:
          BUILD_ARCH: arm64
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build
      - name: Actual macOS proxy chain and failure localization
        run: mkdir -p test-results && pnpm test:integration | tee test-results/chain-macos.txt
      - name: Real desktop workflow on macOS
        run: pnpm test:desktop

